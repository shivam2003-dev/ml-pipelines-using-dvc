stages:
  data_ingestion:
    cmd: .venv/bin/python src/data_ingestion.py
    deps:
    - src/data_ingestion.py
    - params.yml
    outs:
    - data/raw
  data_preprocess:
    cmd: .venv/bin/python src/data_preprocessing.py
    deps:
    - src/data_preprocessing.py
    - data/raw
    outs:
    - data/preprocessed
  feature_engineering:
    cmd: .venv/bin/python src/feature_engineering.py
    deps:
    - data/preprocessed
    - src/feature_engineering.py
    - params.yml
    outs:
    - data/features

  model_training:
    cmd: .venv/bin/python src/model_building.py
    deps:
    - data/features
    - src/model_building.py
    - params.yml
    outs:
    - models/model.joblib

  model_evaluation:
    cmd: .venv/bin/python src/model_evaluation.py
    deps:
    - data/features
    - models/model.joblib
    - src/model_evaluation.py
    metrics:
    - reports/metrics.json
    outs:
    - reports/classification_report.txt
